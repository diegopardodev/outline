[package]
name = "outline"
version = "0.1.0"
edition = "2021"

[lib]
name = "outline_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ignore = "0.4"
trash = "5"
notify = "8"
notify-debouncer-mini = "0.7"
portable-pty = "0.9"
regex = "1"
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
